# Updates for what Waterline is built from (#101): npm packages, the GitHub
# Actions in .github/workflows, and the Docker base image. Weekly, grouped so a
# week's routine updates come as one pull request each; security updates come
# on their own as soon as there's an advisory.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # waiting on the tools around them (#129):
      # Auth.js supports SvelteKit 1-2 only, adapter-node 6 needs SvelteKit 3, svelte-check refuses TypeScript 7
      - dependency-name: '@sveltejs/kit'
        update-types: [version-update:semver-major]
      - dependency-name: '@sveltejs/adapter-node'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node's odd-numbered majors are short-lived "Current" releases; the image stays on an LTS (even) one
      - dependency-name: node
        versions: ['>= 23, < 24', '>= 25, < 26', '>= 27, < 28', '>= 29, < 30']
