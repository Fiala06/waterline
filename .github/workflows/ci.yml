# One branch, main. Every push and pull request gets the quick set: the type
# check, the unit tests and the end-to-end tests in Chromium (three machines
# at once).
#
# The full set adds the smoke tests in Safari and Firefox, the performance
# budgets, and the Docker image with its vulnerability scan. It runs for a
# release (package.json has a version with no v<version> tag yet, on main or
# on the pull request that brings it), every Monday, and when started by hand
# (Actions › CI › Run workflow). These break rarely and cost about as much as
# the quick set, so an ordinary push doesn't wait for them.
#
# The image is published to ghcr.io/fiala06/waterline only for a release: once
# every job has passed on main, it is pushed as :latest, :<version>,
# :<major>.<minor> and :sha-xxxxxxx, and a GitHub release is made with that
# version's section of CHANGELOG.md. So :latest is always a release, and the
# version a server shows is the one it runs.
#
# The image is scanned for known vulnerabilities before anything is pushed,
# and a release carries its SBOM (see SECURITY.md; more checks in security.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # the full set weekly, so a break in it shows within days, not at the next release
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Is this a release (package.json's version has no v<version> tag yet), and
  # does the full set run? A few seconds; the jobs of the full set wait for it.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      new: ${{ steps.version.outputs.new }}
      full: ${{ steps.version.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            new=false
          else
            new=true
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = true ] || [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            full=true
          else
            full=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Version $v: release $new, full set $full" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Check and unit tests
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=phone --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The essentials on an iPhone and desktop Safari (WebKit) and Firefox (#104);
  # the full suite above is Chromium's. Part of the full set.
  browsers:
    name: Smoke tests (iPhone, Safari, Firefox)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - run: npm run test:e2e:browsers

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-browsers
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Performance budgets (#110): the main pages' load time, layout shift, server
  # response and size, a tap on Quick add, and the gzipped JavaScript bundle,
  # against e2e/perf-budgets.json. The numbers go in the run's summary.
  # Part of the full set.
  perf:
    name: Performance budgets
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # builds the app (Playwright's web server), then measures the pages
      - run: npm run test:perf
      - run: node scripts/bundle-size.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Built alongside the tests, as part of the full set (not on a pull request),
  # so a broken image shows before it's published. Nothing is pushed here.
  docker:
    name: Docker image
    needs: plan
    if: needs.plan.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: waterline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image as it will ship, scanned with Grype (#101): a high or critical
      # vulnerability that has a fix fails here, so it can't be published.
      # Ones that can't reach Waterline are listed with why in .grype.yaml.
      # Third-party actions are pinned to a commit, not a movable tag.
      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: waterline:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          config: .grype.yaml

      # A release's bill of materials (SPDX), attached to its GitHub release
      - name: SBOM
        if: needs.plan.outputs.new == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: waterline:ci
          format: spdx-json
          output-file: waterline-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.new == 'true'
        with:
          name: sbom
          path: waterline-sbom.spdx.json
          retention-days: 7

  # A release: once every check and test has passed, the same image (all of it
  # from the build's cache) is pushed to ghcr.io.
  publish:
    name: Publish image
    needs: [plan, check, e2e, browsers, perf, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.new == 'true'
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/waterline
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ needs.plan.outputs.minor }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # the SBOM and build provenance travel with the image in the registry
          sbom: true
          provenance: mode=max

  release:
    name: GitHub release
    needs: [plan, docker, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.new == 'true'
    runs-on: ubuntu-latest
    # a stuck step (a crawling package mirror) fails the job instead of holding a release for hours
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # the section, with in-app links ([Charts](/charts)) as their words: on GitHub they'd point at github.com
          awk -v h="## $VERSION " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md \
            | sed -E 's/\[([^]]+)\]\(\/[^)]*\)/\1/g' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          echo "" >> notes.md
          echo "Docker image: \`ghcr.io/fiala06/waterline:$VERSION\`" >> notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mv waterline-sbom.spdx.json "waterline-$VERSION-sbom.spdx.json"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md "waterline-$VERSION-sbom.spdx.json"
