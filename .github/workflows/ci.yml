# One branch, main. Every push and pull request is checked and tested, and
# every push to main builds the Docker image. It's published to
# ghcr.io/fiala06/waterline only for a release: when main reaches a version in
# package.json that has no v<version> tag yet, the image is pushed as :latest,
# :<version>, :<major>.<minor> and :sha-xxxxxxx, and a GitHub release is made
# with that version's section of CHANGELOG.md. So :latest is always a release,
# and the version a server shows is the one it runs.
#
# For speed: the end-to-end tests run on three machines at once, and the image
# is built while the tests run. Publishing waits for every test, then pushes
# the same build from the cache.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: End-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Built alongside the tests, on every push, so a broken image shows before a
  # release. Nothing is pushed here.
  docker:
    name: Docker image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7

      # Is package.json's version a new release (no v<version> tag yet)?
      - id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release: once every check and test has passed, the same image (all of it
  # from the build's cache) is pushed to ghcr.io.
  publish:
    name: Publish image
    needs: [check, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docker.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/waterline
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ needs.docker.outputs.version }}
            type=raw,value=${{ needs.docker.outputs.minor }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    name: GitHub release
    needs: [docker, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docker.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.docker.outputs.version }}
        run: |
          # the section, with in-app links ([Charts](/charts)) as their words: on GitHub they'd point at github.com
          awk -v h="## $VERSION " 'index($0, h) == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md \
            | sed -E 's/\[([^]]+)\]\(\/[^)]*\)/\1/g' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          echo "" >> notes.md
          echo "Docker image: \`ghcr.io/fiala06/waterline:$VERSION\`" >> notes.md

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.docker.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
