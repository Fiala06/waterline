# Security checks (#101), beside CI. See SECURITY.md for what each one blocks.
# - CodeQL reads the app's TypeScript and these workflows for security bugs.
# - On a pull request, dependency review refuses newly added packages with a
#   high or critical advisory.
# - npm audit fails on a high or critical advisory in what the server runs
#   (dev tools aside), unless it's listed with a reason in
#   .github/security/npm-audit-allow.json.
# The image itself is scanned in CI (ci.yml), before a release can publish.
#
# These run when a push or pull request changes package.json, the lockfile,
# the workflows or the audit's allow list: so for every release (it changes
# the version) and every change of dependencies, not for every push.
# Weekly too, so a new advisory or finding shows up without one.
name: Security

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/**
      - .github/security/**
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/**
      - .github/security/**
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # can't reach Waterline, as in .github/security/npm-audit-allow.json and .grype.yaml (look again 2026-12-17):
          # GHSA-3r8g-jcqq-3p5j, SvelteKit remote functions, which Waterline doesn't use; fixed only in Kit 3
          allow-ghsas: GHSA-3r8g-jcqq-3p5j

  npm-audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: node scripts/npm-audit.mjs
