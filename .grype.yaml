# Grype, the image scan in CI (#101; see SECURITY.md). A high or critical
# vulnerability with a fix available fails the build, so a release can't
# publish with it. When one can't reach Waterline, list it here with why and
# when to look again, rather than lowering the bar:
#
# ignore:
#   - vulnerability: CVE-2026-12345
#     package:
#       name: libexample
#     # why: only reachable through the example CLI, which the image never runs; look again 2027-01-01
ignore:
  - vulnerability: GHSA-3r8g-jcqq-3p5j
    package:
      name: "@sveltejs/kit"
    # why: a DoS in remote functions' form parsing; Waterline has no remote functions (no *.remote.ts,
    # nothing from $app/server), and the only fix is Kit 3.1.1+, a major upgrade. As in
    # .github/security/npm-audit-allow.json; look again 2026-12-17
