# Example: set ORIGIN, then docker compose up -d and open it. The first page
# asks for the setup code in this container's log (docker compose logs waterline).
services:
  waterline:
    build: .
    # image: ghcr.io/fiala06/waterline:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - waterline-data:/data
    environment:
      ORIGIN: https://tanks.example.com # the URL people open
      # Behind a reverse proxy, so failed logins are limited per visitor:
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: 1
      # Everything else (Google sign-in, who can sign in, email) is set in the app,
      # in Settings › Server settings. The README lists the optional rest.

volumes:
  waterline-data:
