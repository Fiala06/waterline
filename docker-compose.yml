# Example: docker compose up -d
# Fill in the values below (or put them in a .env file next to this one).
services:
  waterline:
    build: .
    # image: ghcr.io/fiala06/waterline:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - waterline-data:/data
    environment:
      ORIGIN: https://tanks.example.com # the URL people open
      AUTH_SECRET: ${AUTH_SECRET} # openssl rand -base64 32
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Who else may sign in besides the admin (emails or @domains, comma-separated)
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      # OPEN_SIGNUP: 'true' # let anyone with a Google account sign up
      # Behind a reverse proxy, so the admin login limit sees each visitor:
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: 1
      # Optional local admin fallback: run hash-password in the container (or npm run hash-password)
      LOCAL_ADMIN_PASSWORD_HASH: ${LOCAL_ADMIN_PASSWORD_HASH:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

volumes:
  waterline-data:
